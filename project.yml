name: PrivateGram
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PrivateGram:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PG_IOS_BUNDLE_ID)
        PRODUCT_NAME: PrivateGram
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: $(PG_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: true
        # Only used if YOU pick "Take Photo/Video" in the upload picker. The app never asks on its own.
        NSCameraUsageDescription: Only used when you choose to take a photo or video to post.
        NSMicrophoneUsageDescription: Only used when you choose to record a video to post.
        NSPhotoLibraryAddUsageDescription: Only used when you choose to save an image.
        ITSAppUsesNonExemptEncryption: false
        # Background App Refresh for message/activity checks (local notifications only).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: privacy
            UIApplicationShortcutItemTitle: Privacy
            UIApplicationShortcutItemIconSymbolName: lock.shield

  PrivateGramMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Privacy.swift
      - path: MacSources
      - path: MacResources
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PG_MAC_BUNDLE_ID)
        PRODUCT_NAME: PrivateGram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MacResources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacResources/PrivateGram.entitlements
        # Signed locally (no Apple account needed, never expires).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacResources/Info.plist
      properties:
        CFBundleDisplayName: $(PG_DISPLAY_NAME)
        CFBundleName: $(PG_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Open source (MIT). Not affiliated with Instagram or Meta.
    entitlements:
      path: MacResources/PrivateGram.entitlements
      properties:
        # App Sandbox: the app can only reach the network and files you pick yourself.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
